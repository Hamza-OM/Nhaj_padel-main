<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Padel Point</title>
    <meta
      name="description"
      content="Book a padel court in Muscat in under a minute. 8 professional courts, tiered hourly rates, and instant confirmation — no account required."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- The home page hero photo is the page's LCP element. It's referenced
         from React (client-rendered), so without this preload the browser
         can't discover it until JS has parsed and mounted the app — a Lighthouse
         audit measured a 425ms load delay from this alone. -->
    <link rel="preload" as="image" href="/images/padel-hero.jpg" fetchpriority="high" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
